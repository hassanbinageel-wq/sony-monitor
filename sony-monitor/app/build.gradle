plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hsnpmt.sonymonitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.hsnpmt.sonymonitor"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        // اسم واضح للنسخة: أساس قابل للبناء + يحتاج اختبارًا على كاميرا فعلية
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        debug {
            // نبقيه debuggable لتسهيل تثبيت الـ APK من Artifacts
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'

    // Coroutines لإدارة اتصال الكاميرا والبث بدون تجميد الواجهة
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // OkHttp لطلبات JSON-RPC وبثّ liveview من الكاميرا
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
